name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Validate package and checked artifact
        run: npm run validate
      - name: Discover packed node in isolated n8n
        run: npm run smoke:n8n
